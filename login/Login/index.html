<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="user signinBox">
                <div class="imgBox">
                    <img src="img/signinIMG.jpg" alt="">
                </div>
                <div class="formBox">
                    <form action="#" id="loginForm">
                        <h2>Login</h2>
                        <input type="text" name="username" placeholder="Enter Username" required id="username">
                        <input type="password" name="password" placeholder="Enter Password" required id="password">
                        <input type="submit" value="Login">
                        
                        <div id="alertBox" class="alert" style="display:none;"></div>
                        
                        <p class="signup">Don't have an Account? <a href="#" onclick="javascript:doToggle();">Sign Up</a></p>
                    </form>
                </div>
            </div>
            <div class="user signupBox">
                <div class="formBox">
                    <form action="#" id="registerForm">
                        <h2>Create An Account</h2>
                        <input type="text" name="username" placeholder="Enter Username" required id="RegUsername">
                        <input type="email" name="email" placeholder="Enter Email" required id="email">
                        <input type="password" name="password" placeholder="Enter Password" required id="RegPassword">
                        <input type="submit" value="Sign Up">
                        <p id="message"></p>
                        <p class="signup">Already have an Account? <a href="#" onclick="javascript:doToggle();">Login</a></p>
                    </form>
                </div>
                <div class="imgBox">
                    <img src="img/signupIMG.jpg" alt="">
                </div>
            </div>
        </div>
    </section>
    <script type="text/javascript">
        function doToggle(){
            var container = document.querySelector('.container');
                container.classList.toggle('active')
        }
    </script>
    <script src="js/login.js" defer></script>
    <script src="js/register.js" defer></script>
</body>
</html>
